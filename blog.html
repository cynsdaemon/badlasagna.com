---
layout: default
title: "Blog"
permalink: /blog/
---

<main class="page-wrapper">

  <h1>Blog</h1>

  <div class="archive-list">

    {% for post in site.posts %}
      <a href="{{ post.url }}" class="archive-item archive-link">
        <div class="archive-episode">

          {% if post.image %}
            <img src="{{ post.image }}" class="archive-thumb">
          {% endif %}

          <div class="archive-meta">
            <span class="archive-title">{{ post.title }}</span>
            <span class="archive-date">{{ post.date | date: "%B %-d, %Y" }}</span>
          </div>

        </div>
      </a>
    {% endfor %}

  </div>

</main>
