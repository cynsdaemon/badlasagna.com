---
layout: default
title: "Blog"
permalink: /blog/
---

<main class="blog-content">

  <h1>Blog</h1>
  <p>Updates, process notes, and cosmic bureaucracy musings.</p>

  <div class="blog-list">

    {% assign posts = site.posts %}
    {% for post in posts %}
      <a href="{{ post.url }}" class="blog-item">
        <div class="blog-item-inner">

          {% if post.image %}
            <img src="{{ post.image }}" alt="{{ post.title }} thumbnail" class="blog-thumb">
          {% endif %}

          <div class="blog-meta">
            <span class="blog-title">{{ post.title }}</span>
            <span class="blog-date">{{ post.date | date: "%B %-d, %Y" }}</span>
          </div>

        </div>
      </a>
    {% endfor %}

  </div>

</main>
