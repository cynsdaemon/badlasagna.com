---
layout: default
title: "Comic Archive"
---
<ul class="comic-archive">
  {% assign pages = site.comics | sort: "comic_order" %}
  {% for p in pages %}
    {% assign comic_number = p.comic_order | default: 0 | prepend: "000" | slice: -3, 3 %}
    <li><a href="{{ p.url }}">Comic {{ comic_number }}: {{ p.title }}</a></li>
  {% endfor %}
</ul>
