<article class="comic-page">
  <h1>{{ page.title }}</h1>
  <img src="{{ page.image }}" alt="{{ page.title }}">
</article>


<nav class="comic-nav">
  {% assign pages = site.comics | sort: "order" %}
  {% for p in pages %}
    {% if p.order == page.order %}
      {% assign index = forloop.index0 %}
    {% endif %}
  {% endfor %}

  {% if index > 0 %}
    <a href="{{ pages[index | minus: 1].url }}">← Previous</a>
  {% endif %}

  {% if index < pages.size | minus: 1 %}
    <a href="{{ pages[index | plus: 1].url }}">Next →</a>
  {% endif %}
</nav>
