---
layout: default
---

<article class="blog-content blog-post">
  <h1>{{ page.title }}</h1>

  {% if page.image %}
    <div class="blog-featured">
      <img src="{{ page.image }}" alt="{{ page.title }} featured image">
    </div>
  {% endif %}

  {{ content }}

  <p style="margin-top: 3rem;">
    <a href="/blog/" class="archive-link">← Back to Blog</a>
  </p>
</article>
