---
layout: default
---

<article class="blog-content">

  <!-- Post Title -->
  <h1>{{ page.title }}</h1>

  <!-- Featured Image (optional) -->
  {% if page.image %}
    <div class="blog-featured">
      <img src="{{ page.image }}" alt="{{ page.title }} featured image">
    </div>
  {% endif %}

  <!-- Post Content -->
  {{ content }}

</article>
